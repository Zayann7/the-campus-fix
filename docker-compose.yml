services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: campus-fix-backend

    environment:
      DATA_FILE: /data/submissions.json
      PYTHONUNBUFFERED: "1"

    volumes:
      - backend_data:/data

    ports:
      - "5000:5000"

    restart: unless-stopped

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health')"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: campus-fix-frontend

    environment:
      PORT: "3000"
      NODE_ENV: production
      FLASK_BACKEND_URL: http://backend:5000

    ports:
      - "3000:3000"

    depends_on:
      backend:
        condition: service_healthy

    restart: unless-stopped

volumes:
  backend_data: